<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position</title>
    <style>
      .parent {
        background-color: tomato;
        width: 100%;
        height: 90vh;
        /* padding: 2rem 1rem; */
        /* margin: auto; */
        position: relative;
        /* top: 70px; */
        /* right: 0px; */
        margin-top: 100px;
      }

      .child {
        background-color: teal;
        width: 50%;
        height: 100%;
        margin: auto;
      }

      .sub_child {
        background-color: red;
        width: 25%;
        height: 100%;
        margin: auto;
        position: absolute;
        top: 100px;
      }
    </style>
  </head>
  <body>
    <!-- 
    
    Position :
            static -> default
            relative -> parent 
            absolute -> closest encestor
            fixed -> closest encestor
            sticky -> scroll behaviour according to parent width/height          
    -->

    <div class="parent">
      <div class="child">
        <div class="sub_child"></div>
      </div>
    </div>
  </body>
</html>
