<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animations</title>
    <style>
        .img_div {
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .img_div>img {
            animation: rotate 3s linear infinite;
            animation-play-state: paused;
        }

        .img_div>img:hover {
            animation-play-state: running;
        }



        @keyframes rotate {

            from {
                rotate: 0deg;
            }

            to {
                rotate: 360deg;
            }

        }
    </style>
</head>

<body>
    <div class="img_div">
        <img src="../utils/react-logo-svgrepo-com.svg" alt="">
    </div>
</body>

</html>
