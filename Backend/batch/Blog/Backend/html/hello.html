<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .containt {
            width: 200px;
            height: 300px;
            background: tomato;
        }

        .containt:hover {
            width: 600px;
            background: teal;
            transition: all 1s ease-in;
        }

        .gradient {
            border: 2px solid gray;
            height: 50vh;
            background: linear-gradient(to top left, red, blue);
        }
    </style>


</head>

<body>
    <div class="containt"></div>


    <div class="gradient"></div>

</body>

</html>
