  <script>
    const date = new Date();
    console.log(`🚀 ~ date:before`, date);

    date.setTime(date.getTime() + 60 * 1000);

    console.log(`🚀 ~ date:after`, date);

    const expire = date.toUTCString();

    console.log(`🚀 expire`, expire);

    document.cookie = `username=mehfooz; expires=${date}; path=/`;
