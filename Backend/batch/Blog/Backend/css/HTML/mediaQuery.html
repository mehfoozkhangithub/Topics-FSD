<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>media Query</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        line-height: 1.5;
        font-size: 2rem;
        margin: 0.2rem 0.3rem;
        text-align: center;
        box-sizing: border-box;
      }

      header {
        height: 100px;
        background: red;
      }

      main {
        background: wheat;
        display: flex;
        align-items: center;
        height: 400px;
        padding: 10px;
        gap: 10px;
      }

      aside {
        background: purple;
      }

      section {
        display: flex;
        flex-direction: column;
        background: blueviolet;
        padding: 10px;
        gap: 10px;
      }

      aside,
      section {
        height: 100%;
        width: 100%;
      }

      article {
        margin: 0;
        height: 50% !important;
        background: tomato;
      }

      article > p {
        margin: 0;
      }

      footer {
        background: gray;
        height: 200px;
      }

      p {
        height: inherit;
      }

      @media (max-width: 480px) {
        * {
          font-size: 1.5rem;
        }

        main {
          flex-direction: column;
        }
      }

      @media (min-width: 481px) and (max-width: 768px) {
        * {
          font-size: 1.9rem;
        }

        main {
          flex-direction: row-reverse;
        }

        section {
          flex-direction: column-reverse;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <p>header</p>
    </header>

    <main>
      <aside>
        <p>aside</p>
      </aside>
      <section>
        <article>
          <p>paragraph</p>
        </article>
        <article>
          <p>article</p>
        </article>
      </section>
    </main>

    <footer>
      <p>footer</p>
    </footer>
  </body>
</html>
