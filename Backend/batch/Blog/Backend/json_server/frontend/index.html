<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todo CRUD-method with server</title>
    <style>
      /* #todo {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        justify-items: center;
        align-items: center;
      } */

      .card_div {
        display: flex;
        justify-content: start;
        align-items: center;
        gap: 1.2rem;

        animation: fadeReload 0.3s ease;
      }

      /* card animation */
      @keyframes fadeReload {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* container reload effect */
      #todo.reload {
        animation: reloadEffect 0.4s ease;
      }

      @keyframes reloadEffect {
        0% {
          opacity: 0.3;
          transform: scale(0.98);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* loader hidden */
      .hidden {
        display: none;
      }

      /* loader style */
      .loader {
        width: 40px;
        height: 40px;
        border: 4px solid #ddd;
        border-top: 4px solid #333;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;

        margin: 20px auto;
      }

      /* animation */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <form id="input_and_btn" onsubmit="addTodo(event)">
      <input type="text" placeholder="enter todo..." id="value" />
      <button type="submit">add</button>
    </form>
    <!-- below this we get all the todo -->
    <div id="loader" class="loader hidden"></div>
    <div id="todo"></div>
  </body>
  <script src="./index.js"></script>
</html>
