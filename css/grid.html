<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .parent {
        height: 90vh;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        grid-template-areas:
          'child_4 child_2'
          'child_3 child_1'
          'child_5 .';
        gap: 1rem;
        justify-items: center;
        align-items: center;
      }

      .box {
        width: 200px;
        height: 200px;
        background: tomato;
        color: black;
        line-height: 6;
        font-weight: 600;
        text-align: center;
        font-size: xx-large;
      }

      .child_1 {
        grid-area: child_1;
      }
      .child_2 {
        grid-area: child_2;
      }
      .child_3 {
        grid-area: child_3;
      }
      .child_4 {
        grid-area: child_4;
      }
      .child_5 {
        grid-area: child_5;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box child_1">div-1</div>
      <div class="box child_2">div-2</div>
      <div class="box child_3">div-3</div>
      <div class="box child_4">div-4</div>
      <div class="box child_5">div-5</div>
    </div>
  </body>
</html>
