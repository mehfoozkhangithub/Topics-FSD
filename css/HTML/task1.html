<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task</title>
    <style>
        .parent {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-areas:
                'child_1 child_2 child_4'
                'child_3 child_3 child_5'
                'child_6 child_7 .';
            gap: 10px;
            padding: 5px;
            border: 2px solid red;
            text-align: center;
            line-height: 5;
        }

        .child_1 {
            background: tomato;
            grid-area: child_1;
        }

        .child_2 {
            background: teal;
            grid-area: child_2;
        }

        .child_3 {
            background: purple;
            grid-area: child_3;
        }

        .child_4 {
            background: red;
            grid-area: child_4;
        }

        .child_5 {
            background: greenyellow;
            grid-area: child_5;
        }

        .child_6 {
            background: yellow;
            grid-area: child_6;
        }

        .child_7 {
            background: brown;
            grid-area: child_7;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="child_1">1</div>
        <div class="child_2">2</div>
        <div class="child_3">3</div>
        <div class="child_4">4</div>
        <div class="child_5">5</div>
        <div class="child_6">6</div>
        <div class="child_7">7</div>
    </div>
</body>

</html>
