<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      img {
        width: 100%;
        height: 100%;
      }

      div {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(4, 1fr);
        /* grid-template-columns: if(
          @media (width <= 786px): repeat(1, 1fr),
          @media (width <= 1024px): repeat(2, 1fr),
          else: repeat(4, 1fr)
        ); */
      }

      @media screen and (max-width: 1024px) {
        div {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media screen and (max-width: 768px) {
        div {
          grid-template-columns: repeat(1, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <div>
      <img src="../../utils/neu_pass.png" alt="" />
      <img src="../../utils/react-logo-svgrepo-com.svg" alt="" />
      <img src="../../utils/raspberry-7313702_1920.jpg" alt="" />
      <img src="../../utils/cherries-8673179_1920.jpg" alt="" />
    </div>
  </body>
</html>
