<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .table {
        border: 2px outset gray;
      }
      .table th,
      .table td {
        border: 1px inset gray;
        background: tan;
      }
    </style>
  </head>
  <body>
    <table border="2">
      <thead>
        <tr>
          <th>sr</th>
          <th>name</th>
          <th>age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>mehfooz</td>
          <td>infinity</td>
        </tr>
      </tbody>
    </table>

    <h2><mark>without border attributes</mark></h2>
    <table class="table">
      <thead>
        <tr>
          <th>sr</th>
          <th>name</th>
          <th>age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>mehfooz</td>
          <td>infinity</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
