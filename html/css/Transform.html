<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* .parent{
        
        } */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-align: center;
        text-transform: capitalize;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: xx-large;
      }

      .parent {
        display: flex;
        justify-content: space-evenly;
        margin: 50px 0;
        perspective: 600px;
      }

      .box {
        width: 200px;
        height: 200px;
        background: blue;
        line-height: 6.4;
        color: #ffff;
      }
      .child_1,
      .child_2,
      .child_4,
      .child_5,
      .child_3 {
        transition: all 2s ease;
      }

      .child_1:hover {
        transform: rotate(360deg);
        background-color: tomato;
      }
      .child_2:hover {
        transform: scale(3);
        background-color: teal;
      }
      .child_3:hover {
        transform: skewX(90deg);
        background-color: teal;
      }
      .child_4:hover {
        transform: translate(100px, 150px) rotate(360deg) scale(0.5);
        background-color: teal;
      }

      .child_5:hover {
        transform: rotate3d(1, 1, 1, 360deg);

        background-color: tomato;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box child_1">child_1</div>
      <div class="box child_2">child_2</div>
      <div class="box child_3">child_3</div>
      <div class="box child_4">child_4</div>
      <div class="box child_5">child_5</div>
    </div>
  </body>
</html>
