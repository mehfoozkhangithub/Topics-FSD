<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;

            font-size: 2rem;
            text-align: center;
            line-height: 300px;
            font-style: italic;
        }

        .box {
            width: 300px;
            height: 300px;
            background: blue;
            color: #fff;
        }

        .child-1 {
            rotate: 180deg;
        }

        .child-2 {
            transform: rotateX(50deg);
        }

        .child-3 {
            transform: rotateY(70deg);
        }

        .child-4 {
            transform: rotateZ(90deg);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box child-1">rotate-180deg</div>
        <div class="box child-2">rotate-X</div>
        <div class="box child-3">rotate-Y</div>
        <div class="box child-4">rotate-Z</div>
    </div>


</body>

</html>
