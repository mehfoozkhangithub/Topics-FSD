<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-align: center;
      }

      header {
        background: red;
        padding: 1rem;
      }
      nav {
        background: aqua;
        padding: 0.3rem 0;
        margin: 0.12rem 0;
      }

      main {
        display: flex;
        width: 100%;
        gap: 0.3rem;
        margin: 0.2rem 0;
      }

      main > section:first-child > p {
        background: wheat;
        height: 50%;
        line-height: 6;
      }
      main > section:first-child > article {
        background: orangered;
        height: 50%;
        line-height: 5;
      }
      main > section:last-child > aside {
        background: rgba(251, 31, 236, 0.903);
        height: inherit;
        line-height: 10;
      }

      main > section {
        width: 100%;
        height: 60vh;
      }

      main > section:first-child {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      footer {
        background: gray;
        padding: 1rem;
      }

      /* media query */

      @media (max-width: 480px) {
        main {
          flex-direction: column;
        }

        main > section {
          height: 40vh;
        }

        main > section:first-child {
          flex-direction: column-reverse;
        }
      }
    </style>
  </head>
  <body>
    <header>header</header>
    <nav>nav</nav>
    <main>
      <section class="section_1">
        <p>paragraph</p>
        <article>article</article>
      </section>
      <section class="section_2">
        <aside>aside</aside>
      </section>
    </main>
    <footer>footer</footer>
  </body>
</html>
